<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
</head>
<body>

<input type="text" id="input" placeholder="Stiskni Enter..." autofocus>

<script>
document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    window.location.href = "../home";
  }
});
</script>

</body>
</html>
