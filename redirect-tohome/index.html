<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
</head>
<body>

<input type="text" id="input" placeholder="Stiskni Enter..." autofocus>

<script>
document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        window.location.href = "../home";
    }
});
</script>

</body>
</html>
