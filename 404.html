<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 - Ztraceno ve vesmíru</title>

<style>
@font-face {
  font-family: "GoogleSansFlex";
  src: url("/fonts/GoogleSansFlex-Regular.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: "GoogleSansFlex", sans-serif;
  height: 100vh;
  overflow: hidden;
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  background: radial-gradient(circle at top, #0b1026, #05060f, #000);
}

/* canvas space background */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* glow container */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  animation: fadeIn 1.2s ease-out;
}

h1 {
  font-size: 9rem;
  color: #7c4dff;
  text-shadow: 0 0 40px rgba(124, 77, 255, 0.6);
}

p {
  font-size: 1.3rem;
  opacity: 0.85;
  margin-top: 10px;
}

.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 22px;
  border-radius: 14px;
  background: linear-gradient(135deg, #7c4dff, #00e5ff);
  color: white;
  text-decoration: none;
  box-shadow: 0 0 25px rgba(124,77,255,0.4);
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
}

/* floating glow stars */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: float 6s linear infinite;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="container">
  <h1>404</h1>
  <p>Tahle stránka zmizela v černé díře 🌌</p>
  <a class="btn" href="/">Zpět domů</a>
</div>

<script>
/* ⭐ STARFIELD CANVAS */
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = Array.from({length: 200}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5,
  speed: Math.random() * 0.5 + 0.2
}));

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "white";
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();

    s.y += s.speed;
    if (s.y > canvas.height) s.y = 0;
  });

  requestAnimationFrame(draw);
}
draw();

/* 🚫 blokace interakcí */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

/* 🌐 SPA-style navigation (jen kliky přes JS) */
document.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;

  e.preventDefault();
  window.history.pushState({}, "", a.href);
  window.location.href = a.href;
});

/* resize */
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
