<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PS4 Loading</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%; /* důležité, aby gradient pokryl celou výšku */
}

body {
  background: linear-gradient(120deg, #0a0f2c, #1b2a6b);
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CENTER */
.container {
  text-align: center;
}

/* LOGO TEXT */
.title {
  font-size: 28px;
  margin-bottom: 20px;
  opacity: 0.8;
}

/* LOADING BAR */
.bar {
  width: 400px;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #0070ff, #00c6ff);
  box-shadow: 0 0 15px #00c6ff;
  animation: load 4s linear forwards;
}

/* ANIMATION */
@keyframes load {
  from { width: 0%; }
  to { width: 100%; }
}

/* FADE TEXT */
.subtitle {
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="title">Starting application… 🎮</div>

  <div class="bar">
    <div class="fill"></div>
  </div>

  <div class="subtitle">codingwithpernicek.com/ps4</div>
</div>

<script>
setTimeout(() => {
  window.location.href = "ps4";
}, 4000);
</script>

</body>
</html>
