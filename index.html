<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding With Pernicek - Načítání</title>

<link rel="icon" type="image/png" href="loadingfavicon.png">
<link rel="apple-touch-icon" href="loadingfavicon.png">

<style>

/* ===== ZÁKLAD ===== */
body, html {
  margin: 0;
  height: 100%;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: sans-serif;
  color: white;

  background: radial-gradient(circle at 20% 20%, #1a1f3a, transparent 40%),
              radial-gradient(circle at 80% 70%, #2a0f3d, transparent 45%),
              radial-gradient(circle at 50% 50%, #050510, #000);

  animation: bgShift 18s ease-in-out infinite alternate;
}

@keyframes bgShift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(25deg); }
}

/* ===== HVĚZDY ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    radial-gradient(1px 1px at 20px 30px, white, transparent),
    radial-gradient(1px 1px at 120px 80px, white, transparent),
    radial-gradient(2px 2px at 200px 140px, white, transparent),
    radial-gradient(1px 1px at 300px 220px, white, transparent);

  background-size: 400px 400px;
  opacity: 0.35;

  animation: starsMove 60s linear infinite;
  pointer-events: none;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* ===== LOADER ===== */
.loader {
  position: relative;
  width: 120px;
  height: 120px;

  display: flex;
  justify-content: center;
  align-items: center;

  filter: drop-shadow(0 0 20px rgba(120,80,255,0.4));
}

/* ORBITY */
.orbit {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.08);
  animation: spin 2s linear infinite;
}

.orbit:nth-child(1) {
  width: 120px;
  height: 120px;
}

.orbit:nth-child(2) {
  width: 80px;
  height: 80px;
  animation-duration: 1.5s;
}

.orbit:nth-child(3) {
  width: 40px;
  height: 40px;
  animation-duration: 1s;
}

/* JÁDRO */
.core {
  width: 14px;
  height: 14px;
  border-radius: 50%;

  background: linear-gradient(135deg, #ff4fd8, #6c5cff);

  box-shadow:
    0 0 20px rgba(120,80,255,0.6),
    0 0 40px rgba(255,80,200,0.3);

  animation: pulse 1.2s ease-in-out infinite;
}

/* ANIMACE */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.7; }
}

/* ===== TEXT ===== */
.label {
  position: absolute;
  bottom: 15%;

  font-size: 14px;
  opacity: 0.75;

  letter-spacing: 2px;
  text-align: center;
}

</style>
</head>

<body>

<div class="loader">
  <div class="orbit"></div>
  <div class="orbit"></div>
  <div class="orbit"></div>
  <div class="core"></div>
</div>

<div class="label">NAČÍTÁNÍ GALAXIE...</div>

<script>
  // 🚀 plynulý přechod do space-home
  setTimeout(() => {
    document.body.style.transition = "0.6s ease";
    document.body.style.opacity = "0";

    setTimeout(() => {
      window.location.href = "home";
    }, 600);

  }, 3000);
</script>

</body>
</html>
