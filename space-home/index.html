<!DOCTYPE html>
<html lang="cs">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding With Pernicek - Cosmic Home</title>

<style>

/* ===== FONT LOAD ===== */
@font-face {
  font-family: 'GoogleSansFlexLocal';
  src: url('../fonts/GoogleSansFlex-Regular.ttf') format('truetype');
  font-weight: 100 1000;
  font-display: swap;
}

/* ===== BODY ===== */
body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;

  font-variation-settings:
    "wght" 500,
    "ROND" 100;

  font-family: 'GoogleSansFlexLocal', sans-serif;
  user-select: none;
  color: white;

  display: flex;

  background: radial-gradient(circle at 20% 20%, #1a1f3a, transparent 40%),
              radial-gradient(circle at 80% 70%, #2a0f3d, transparent 45%),
              radial-gradient(circle at 50% 50%, #050510, #000);

  animation: bgShift 20s ease-in-out infinite alternate;
}

@keyframes bgShift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(25deg); }
}

/* ===== STARS ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(1px 1px at 80px 90px, white, transparent),
    radial-gradient(1px 1px at 160px 120px, white, transparent),
    radial-gradient(2px 2px at 300px 200px, white, transparent);

  background-size: 400px 400px;
  opacity: 0.35;

  animation: starsMove 60s linear infinite;
  pointer-events: none;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* ===== TOGGLE BUTTON ===== */
#toggleBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1000;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color: white;

  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;

  padding: 10px 14px;
  font-size: 18px;
  cursor: pointer;

  transition: 0.3s ease;
}

#toggleBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(140,120,255,0.5);
}

/* ===== NAVBAR ===== */
.navbar {
  width: clamp(160px, 12vw, 240px);
  height: 100vh;

  flex-shrink: 0;

  background: rgba(10, 10, 25, 0.6);
  backdrop-filter: blur(18px);

  border-right: 1px solid rgba(255,255,255,0.1);

  display: flex;
  flex-direction: column;
  align-items: center;

  transition: transform 0.35s ease;
}

/* COLLAPSE FIX */
.navbar.collapsed {
  transform: translateX(-100%);
}

/* ===== NAV ITEMS ===== */
.nav-items {
  display: flex;
  flex-direction: column;
  width: 100%;
  margin-top: 1vh;
  align-items: center;
}

.nav-item {
  width: 80%;
  height: 50px;

  margin: 6px 0;
  border-radius: 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;
  color: white;

  background: linear-gradient(135deg, rgba(120,80,255,0.25), rgba(0,255,255,0.08));
  border: 1px solid rgba(255,255,255,0.1);

  transition: 0.25s ease;
}

.nav-item:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(120,80,255,0.4);
}

/* ===== VERSION ===== */
.version-label {
  margin-top: auto;
  margin-bottom: 12vh;
  font-size: 12px;
  opacity: 0.6;
}

/* ===== BOTTOM BUTTON ===== */
.bottom-frame {
  position: absolute;
  bottom: 3vh;
  width: 80%;

  padding: 14px;
  border-radius: 28px;

  text-align: center;
  text-decoration: none;
  color: white;

  background: linear-gradient(135deg, #ff4fd8, #6c5cff);
  box-shadow: 0 0 30px rgba(120,80,255,0.3);

  transition: 0.3s ease;
}

.bottom-frame:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(255,80,200,0.5);
}

/* ===== CONTENT FIXED ===== */
.content-wrapper {
  flex: 1;
  padding: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transition: 0.35s ease;
}

/* ===== CARDS ===== */
.custom-frame {
  width: 80%;
  max-width: 600px;

  padding: 16px;
  margin: 10px 0;

  border-radius: 18px;

  text-align: center;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.1);

  transition: 0.2s ease;
}

.custom-frame:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px rgba(100,200,255,0.25);
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .custom-frame {
    width: 90%;
  }
}

</style>
</head>

<body>

<button id="toggleBtn">☰</button>

<div class="navbar">
  <div class="nav-items">
    <a class="nav-item" href="../home">Domov</a>
    <a class="nav-item" href="../about">O web stránce</a>
    <a class="nav-item" href="../upd-log">Seznam změn</a>
  </div>

  <div class="version-label">v1.9</div>

  <a class="bottom-frame" href="https://www.youtube.com/@Pernicek_Cute" target="_blank">
    Můj kanál
  </a>
</div>

<div class="content-wrapper">
  <div class="custom-frame">Frame 1</div>
  <div class="custom-frame">Frame 2</div>
  <div class="custom-frame">Frame 3</div>
  <div class="custom-frame">Frame 4</div>
  <div class="custom-frame">Frame 5</div>
</div>

<script>
const navbar = document.querySelector(".navbar");
const btn = document.getElementById("toggleBtn");

function toggleNav() {
  navbar.classList.toggle("collapsed");
  btn.textContent = navbar.classList.contains("collapsed") ? "☰" : "✖";
}

btn.addEventListener("click", toggleNav);
</script>

  <script>
(function () {

  function getCookie(name) {
    return document.cookie.split("; ")
      .find(row => row.startsWith(name + "="))
      ?.split("=")[1];
  }

  const key = getCookie("space_key");

  // ❌ pokud cookie neexistuje → nic nedělá (nebo můžeš redirectnout)
  if (!key) return;

  const url = new URL(window.location.href);

  // ✔ pokud už key v URL je → stop
  if (url.searchParams.get("key")) return;

  // 🌌 přidání key do URL
  url.searchParams.set("key", key);

  // 🔁 replace = bez reload loopu v historii
  window.location.replace(url.toString());

})();
</script>
  
</body>
</html>
