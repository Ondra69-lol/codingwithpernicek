<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Import Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif; /* Vlastní font pro celou stránku */
    }
    h1 {
      font-weight: 700; /* tučnější nadpis */
    }

    button {
      background-color: #34a1eb;
      border-radius: 16px;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>codingwithpernicek.com</h1>
<button onclick="alertBox()">Klikni mě pro text</button>
<button onclick="confirmBox()">Klikni mě pro možnost</button>
<button onclick="promptBox()">Klikni mě pro zadání</button>

<script>
function alertBox() {
  // Zobrazí prompt s textem a výchozí hodnotou
  window.alert("Kliknul(a) si mě! :)");
}

function confirmBox() {
  // Zobrazí prompt s textem a výchozí hodnotou
  window.confirm("Vyber si jedno");
}

function promptBox() {
  // Zobrazí prompt s textem a výchozí hodnotou
  window.prompt("Napiš něco");
}
</script>

</body>
</html>
