<!DOCTYPE html>
<html lang="cs">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kosmický Domov</title>

  <!-- 🌐 Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

/* ===== FONT ===== */
@font-face {
  font-family: 'GoogleSansFlexLocal';
  src: url('../fonts/GoogleSansFlex-Regular.ttf') format('truetype');
  font-weight: 100 1000;
  font-display: swap;
}

/* ===== BODY ===== */
body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;

  font-family: 'GoogleSansFlexLocal', sans-serif;
  user-select: none;
  color: white;

  display: flex;

  background: radial-gradient(circle at 20% 20%, #1a1f3a, transparent 40%),
              radial-gradient(circle at 80% 70%, #2a0f3d, transparent 45%),
              radial-gradient(circle at 50% 50%, #050510, #000);

  animation: bgShift 20s ease-in-out infinite alternate;
}

@keyframes bgShift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(25deg); }
}

/* ===== STARS ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(1px 1px at 80px 90px, white, transparent),
    radial-gradient(1px 1px at 160px 120px, white, transparent),
    radial-gradient(2px 2px at 300px 200px, white, transparent);

  background-size: 400px 400px;
  opacity: 0.35;

  animation: starsMove 60s linear infinite;
  pointer-events: none;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* ===== USER BOX ===== */
#userBox {
  position: fixed;
  top: 15px;
  right: 15px;

  display: none;
  align-items: center;
  gap: 10px;

  padding: 8px 12px;
  border-radius: 16px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.2);

  z-index: 9999;
}

#userBox img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
}

/* ===== TOGGLE ===== */
#toggleBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1000;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color: white;

  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;

  padding: 10px 14px;
  font-size: 18px;
  cursor: pointer;
}

/* ===== NAVBAR ===== */
.navbar {
  width: clamp(160px, 12vw, 240px);
  height: 100vh;

  background: rgba(10, 10, 25, 0.6);
  backdrop-filter: blur(18px);

  border-right: 1px solid rgba(255,255,255,0.1);

  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== CONTENT ===== */
.content-wrapper {
  flex: 1;
  padding: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.custom-frame {
  width: 80%;
  max-width: 600px;

  padding: 16px;
  margin: 10px 0;

  border-radius: 18px;
  text-align: center;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<!-- 👤 USER PANEL -->
<div id="userBox">
  <img id="userPic">
  <span id="userName"></span>
</div>

<!-- ☰ BUTTON -->
<button id="toggleBtn">☰</button>

<!-- NAV -->
<div class="navbar">
  <a href="../home">Domov</a>
  <a href="../about">O web stránce</a>
  <a href="../upd-log">Seznam změn</a>
</div>

<!-- CONTENT -->
<div class="content-wrapper">
  <div class="custom-frame">Frame 1</div>
  <div class="custom-frame">Frame 2</div>
  <div class="custom-frame">Frame 3</div>
</div>

<!-- 🌐 GOOGLE LOGIN CONFIG -->
<div id="g_id_onload"
     data-client_id="193508433609-nf39vs7qpfmiroi21empg2uls3mg0dvj.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin" data-type="standard"></div>

<!-- ⚡ SCRIPT -->
<script>

// 🌌 LOGIN HANDLER
function handleCredentialResponse(response) {

    const data = parseJwt(response.credential);

    // 👤 UI
    document.getElementById("userBox").style.display = "flex";
    document.getElementById("userName").innerText = data.name;
    document.getElementById("userPic").src = data.picture;

    // 🔐 ACCESS CONTROL
    if (data.email === "pernicekcute@gmail.com") {
        window.location.replace("../home");
    } else {
        window.location.replace("https://codingwithpernicek.com");
    }
}

// 🧠 JWT decode
function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(base64));
}

</script>

</body>
</html>
